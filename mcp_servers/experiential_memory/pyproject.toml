[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "experiential-memory"
version = "0.1.0"
description = "MCP server for Winston's episodic memory system"
readme = "README.md"
license = "MIT"
authors = [{ name = "Winston Team" }]
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=0.1.0",
    "chromadb>=0.4.0",
    "loguru>=0.7.0",
]

[project.scripts]
experiential-memory = "experiential_memory:main"